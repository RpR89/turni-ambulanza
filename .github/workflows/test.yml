name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Regole di sicurezza del database (schema.sql) su un Postgres vero
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/test/mock_auth.sql -f supabase/schema.sql \
            -f supabase/test/schema_test.sql | tee schema-test.log
          grep -q 'FINE OK' schema-test.log
